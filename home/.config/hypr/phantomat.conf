# Native zoomable canvas; Phantomat built for Hyprland 0.56.2.
plugin = @HOME@/.local/share/phantomat/spatialoverview.so
plugin {
    spatialoverview {
        animation {
            enabled = true
            speed = 3
        }
        distortion {
            enabled = false
        }
        workspace_outline {
            enabled = false
            drop_opacity = 0.0
            drop_fill_opacity = 0.0
        }
        input {
            drag_threshold = 3
        }
        canvas {
            enabled = true
            desktop_mode = true
            persistent = false
            linked_screens = true
            initial_zoom = 0.55
            min_zoom = 0.05
            max_zoom = 2.5
            zoom_step = 0.12
            auto_float = true
            auto_place = false
            placement_gap = 40
            space_pan = false
            hover_focus = false
            grid_enabled = false
            grid_style = 1
            grid_size = 100
            grid_opacity = 0.12
            background_dim = 0.20
            viewport_enabled = false
            float_on_drag = true
            allow_window_overflow = true
            snap_enabled = false
            snap_viewport_on_pan = false
            commit_viewport_on_close = false
            remember_layout = false
            minimap_enabled = false
        }
        navigator {
            enabled = false
            accent = auto
        }
        chrome_animation {
            enabled = true
            top_namespace = waybar
            top_travel = 1.35
            top_scale = 1.0
            opacity = 0.0
        }
    }
}
# Physical =/+ key (and keypad +): works in EN/RU/UA layouts, with or without Shift.
bind = CTRL, code:21, spatialoverview:overview, toggle all
bind = CTRL SHIFT, code:21, spatialoverview:overview, toggle all
bind = CTRL, code:86, spatialoverview:overview, toggle all

# Active only while the canvas is open; plugin restores the previous submap.
submap = spatialoverview
bind = CTRL, code:21, spatialoverview:overview, close all
bind = CTRL SHIFT, code:21, spatialoverview:overview, close all
bind = CTRL, code:86, spatialoverview:overview, close all
bind = , Escape, spatialoverview:overview, close all
bind = , mouse:272, spatialoverview:window, select
bind = CTRL, 0, spatialoverview:canvas, fit
binde = , left, spatialoverview:navigate, left
binde = , right, spatialoverview:navigate, right
binde = , up, spatialoverview:navigate, up
binde = , down, spatialoverview:navigate, down
bind = SUPER, Q, exec, kitty
bind = SUPER, E, exec, ~/.local/bin/dolphin-glass
bind = SUPER, R, exec, ~/.local/bin/rice-apps
bind = SUPER, SPACE, exec, ~/.local/bin/rice-apps
bind = SUPER, L, exec, ~/.local/bin/rice-lock
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
submap = reset
