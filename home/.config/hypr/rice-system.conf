# Managed by Rice Settings (Super+I, Ввод и экран). Manual edits are overwritten.
input {
    kb_layout = us,ru,ua
    kb_options = grp:alt_shift_toggle
    numlock_by_default = false
    repeat_delay = 600
    repeat_rate = 25
    follow_mouse = 0
    sensitivity = 0.00
    touchpad {
        natural_scroll = false
        tap-to-click = true
        disable_while_typing = true
    }
}
