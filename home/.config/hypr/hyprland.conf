# Basic Hyprland session.
monitor = ,preferred,auto,1
$mainMod = SUPER
$terminal = kitty
$fileManager = ~/.local/bin/dolphin-glass
$menu = ~/.local/bin/rice-apps
bind = $mainMod, code:31, exec, ~/.local/bin/rice-settings
bind = $mainMod, G, exec, ~/.local/bin/rice-gamemode toggle
windowrule = float on, match:title ^(Настройки райса)$
windowrule = center on, match:title ^(Настройки райса)$
windowrule = rounding 14, match:title ^(Настройки райса)$
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, C, killactive,
bind = ALT, F4, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, Return, fullscreen, 1
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, M, exec, ~/.local/bin/rice-power
bind = $mainMod, L, exec, ~/.local/bin/rice-lock
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = , Print, exec, grim - | wl-copy
bind = $mainMod, S, exec, grim -g "$(slurp)" - | wl-copy
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
# Dock, widgets and notifications run in one quickshell process.
exec-once = ~/.local/bin/rice-desktop
bind = $mainMod, left, movefocus, l
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod, right, movefocus, r
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod, up, movefocus, u
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod, code:10, workspace, 1
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod SHIFT, code:18, movetoworkspace, 9

# Wallpaper gallery and restore
bind = $mainMod, W, exec, ~/.local/bin/wallpaper-picker
bind = $mainMod SHIFT, W, exec, ~/.local/bin/wallpaper-picker --random
exec-once = ~/.local/bin/wallpaper-picker --restore

layerrule = blur on, match:namespace rofi

# Glass top panel
exec-once = waybar
layerrule = blur on, ignore_alpha 0.2, match:namespace waybar
bind = $mainMod, B, exec, pkill -SIGUSR1 -x waybar

# Dolphin glass appearance
windowrule = opacity 0.98 0.96, match:class ^(org.kde.dolphin)$
windowrule = rounding 18, match:class ^(org.kde.dolphin)$

# Wi-Fi / Bluetooth panel
bind = $mainMod, N, exec, ~/.local/bin/connectivity-widget
bind = $mainMod SHIFT, N, exec, ~/.local/bin/connectivity-widget --bluetooth

# Notification center
bind = $mainMod, A, exec, ~/.local/bin/rice-notifications
bind = $mainMod SHIFT, A, exec, ~/.local/bin/rice-notifications --dnd

layerrule = blur on, match:namespace rice-connectivity

# Application dock
layerrule = blur on, ignore_alpha 0.2, match:namespace rice-dock

# Application launcher
layerrule = blur on, ignore_alpha 0.2, match:namespace rice-apps
layerrule = blur on, ignore_alpha 0.2, match:namespace rice-power

# Desktop widgets
bind = $mainMod SHIFT, P, exec, ~/.local/bin/rice-music --toggle
layerrule = blur on, ignore_alpha 0.1, match:namespace rice-music
layerrule = blur on, ignore_alpha 0.2, match:namespace rice-weather
layerrule = blur on, ignore_alpha 0.2, match:namespace rice-memory

# Anchored notification panel and popups.
layerrule = blur on, ignore_alpha 0.2, match:namespace rice-notification-center
layerrule = blur on, ignore_alpha 0.2, match:namespace rice-notification-toast

# Native zoomable canvas on Ctrl++.
source = ~/.config/hypr/phantomat.conf

# Core X11 fonts for legacy applications such as aafire.
exec-once = xset +fp /usr/share/fonts/misc

# Input, gestures, night light
source = ~/.config/hypr/rice-system.conf

# Desktop appearance
source = ~/.config/hypr/rice-desktop.conf

# Theme carousel
bind = $mainMod, T, exec, ~/.local/bin/rice-themes
layerrule = blur on, ignore_alpha 0.1, match:namespace rice-themes
