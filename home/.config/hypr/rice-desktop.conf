# Managed by Rice Settings (Super+I, Окна). Manual edits are overwritten.
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    resize_on_border = true
    col.active_border = rgb(c4c4ab) rgb(d8d8ca) 45deg
    col.inactive_border = rgba(2b2b2baa)
}
decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 1.00
    dim_inactive = false
    dim_strength = 0.12
    blur {
        enabled = true
        size = 10
        passes = 3
    }
    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(0c091488)
    }
}
animations {
    enabled = true
    bezier = soft, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, soft, popin 90%
    animation = windowsOut, 1, 5, soft, popin 85%
    animation = fade, 1, 5, soft
    animation = border, 1, 8, default
    animation = workspaces, 1, 5, soft, slide
    animation = layers, 1, 5, soft, fade
}
