# Fallback lock screen, used when RiceLock fails to start.
$font = JetBrains Mono

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = soft, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, soft
    animation = fadeOut, 1, 3, soft
    animation = inputFieldDots, 1, 2, soft
}

background {
    monitor =
    path = @HOME@/.config/hypr/lock-assets/black-hole-fallback.png
    color = rgb(0c0b12)
    blur_passes = 0
}


label {
    monitor =
    text = $TIME
    color = rgb(eee3fa)
    font_size = 130
    font_family = Adwaita Sans Light
    shadow_passes = 3
    shadow_size = 7
    shadow_color = rgba(100c18ee)
    position = 0, 10.6%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  /  %d %B"
    color = rgb(bda9d1)
    font_size = 11
    font_family = $font
    position = 0, 0.6%
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(eee3fa)
    font_size = 14
    font_family = Adwaita Sans
    position = 0, -10.2%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 1
    inner_color = rgba(35283fd9)
    outer_color = rgba(d8c0f296) rgba(79628e66) 45deg
    check_color = rgba(b7c9bcee)
    fail_color = rgba(dfa3b7ee)
    font_color = rgb(eee3fa)
    font_family = $font
    fade_on_empty = false
    rounding = 19
    placeholder_text = <span foreground="##bda9d1">Введите пароль</span>
    fail_text = <span foreground="##dfa3b7">Попробуй ещё раз</span>
    check_text = <span foreground="##b7c9bc">Проверка...</span>
    capslock_color = rgba(d7bd98ee)
    dots_size = 0.22
    dots_spacing = 0.45
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0c091640)
    position = 0, -18.2%
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,RU,UA]
    color = rgb(9e8eb5)
    font_size = 8
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, -23.2%
    halign = center
    valign = center
}

