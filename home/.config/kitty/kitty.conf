# Lavender dusk: matches Dolphin and Waybar
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# Deep plum glass, with enough contrast for long sessions
background #252236
foreground #eeeaf6
background_opacity 0.90
dynamic_background_opacity yes
background_blur 24
dim_opacity 0.75
window_padding_width 18
hide_window_decorations yes
window_border_width 1
active_border_color #c6acee
inactive_border_color #443953
inactive_text_alpha 1.0

# Quiet cursor and clear selections
cursor #d4bafa
cursor_text_color #252236
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0
selection_foreground #fbf8ff
selection_background #675181
url_color #a8c9f5
url_style straight

# Small, flat tabs, visible only when needed
tab_bar_edge top
tab_bar_style separator
tab_separator "   "
tab_bar_min_tabs 2
tab_bar_margin_width 6
tab_bar_margin_height 6 8
tab_bar_background #252236
tab_title_template " {index} · {title} "
active_tab_font_style bold
active_tab_foreground #f0e8ff
active_tab_background #4a3b60
inactive_tab_foreground #aca1bc
inactive_tab_background #252236

# Muted colors with readable bright variants
color0  #393348
color1  #eaa2b1
color2  #b4d3ad
color3  #e8cb9d
color4  #a8c9f5
color5  #c6acee
color6  #a8d4ce
color7  #d6cfe2
color8  #8b809d
color9  #ffc0cd
color10 #c9e7c1
color11 #f8dfb3
color12 #c2daff
color13 #dfc8ff
color14 #c2eee7
color15 #faf6ff

scrollback_lines 20000
wheel_scroll_multiplier 3.0
enable_audio_bell no
visual_bell_duration 0
confirm_os_window_close 0
remember_window_size yes
initial_window_width 110c
initial_window_height 30c

# Keep the existing shortcuts
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+f5 load_config_file

